plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}
android {
    namespace 'com.lecturemind.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lecturemind.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        personal {
            storeFile file("${System.getenv('LECTUREMIND_BUILD_ROOT') ?: 'G:/LectureMind-build'}/private/lecturemind.jks")
            storePassword System.getenv('LECTUREMIND_STORE_PASSWORD')
            keyAlias 'lecturemind'
            keyPassword System.getenv('LECTUREMIND_STORE_PASSWORD')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.personal }
        release { minifyEnabled false; signingConfig signingConfigs.personal }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2026.03.01')
    implementation 'androidx.activity:activity-compose:1.12.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencyLocking { lockAllConfigurations() }

// Preserve Guava's Android/JRE flavors while patching the transitive runtime
// and processor dependencies. See GHSA-xxph-c9ww-hj94.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.google.guava' && details.requested.name == 'guava') {
            def flavor = details.requested.version?.endsWith('-android') ? 'android' : 'jre'
            details.useVersion("33.7.2-${flavor}")
            details.because('Patch bounded deserialization allocation, GHSA-xxph-c9ww-hj94')
        }
    }
}
tasks.withType(Test).configureEach {
    minHeapSize = '16m'
    maxHeapSize = '96m'
    maxParallelForks = 1
    jvmArgs '-XX:MaxMetaspaceSize=96m', '-XX:+UseSerialGC', '-XX:ReservedCodeCacheSize=32m'
}
